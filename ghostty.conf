# Catppuccin Mocha: readable first, with a little room around the text.
theme = Catppuccin Mocha
background-opacity = 0.80
background-opacity-cells = true
# Preserve transparency in fullscreen while leaving room for the camera notch.
macos-non-native-fullscreen = padded-notch
font-size = 14
window-padding-x = 10
window-padding-y = 8
window-padding-balance = true
macos-titlebar-style = transparent
cursor-style-blink = false
macos-icon = holographic
confirm-close-surface = false

# Summon a quick terminal from anywhere with Command-Shift-Space.
# macOS will ask for Ghostty Accessibility access for this global binding.
keybind = global:cmd+shift+space=toggle_quick_terminal
# The Russian key in the physical B position should enter tmux's Ctrl+B prefix.
keybind = ctrl+и=text:\x02
# Shift+Enter sends a newline to Codex, including inside tmux.
keybind = shift+enter=text:\x0a
# Broot exits on Ctrl+C; keep that shortcut on the Russian layout too.
keybind = ctrl+с=text:\x03
quick-terminal-position = top
quick-terminal-size = 45%

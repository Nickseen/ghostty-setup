# Allow Codex image thumbnails through tmux (enabled for all windows).
set -g allow-passthrough all
# A quiet Catppuccin Mocha status line with a clear active pane.
set -g mouse on
set -g history-limit 50000
# Permit several Shift+arrow swaps after one prefix press.
set -g repeat-time 2000
set -g initial-repeat-time 2000
# Keep the status-bar shortcuts usable with English and Russian layouts.
bind-key v split-window -h
bind-key м split-window -h
bind-key h split-window -v
bind-key р split-window -v
unbind-key '"'
bind-key с new-window
bind-key я resize-pane -Z
bind-key x kill-pane
bind-key ч kill-pane
bind-key в detach-client
# With the active pane selected, Shift+arrows exchange it with a neighbour.
bind-key -r S-Left swap-pane -d -s '{active}' -t '{left-of}'
bind-key -r S-Right swap-pane -d -s '{active}' -t '{right-of}'
bind-key -r S-Up swap-pane -d -s '{active}' -t '{up-of}'
bind-key -r S-Down swap-pane -d -s '{active}' -t '{down-of}'
# Restore Shift+arrows to apps unless the tmux prefix was pressed.
unbind-key -n S-Left
unbind-key -n S-Right
unbind-key -n S-Up
unbind-key -n S-Down
# Leave unused pane transfer keys unbound in both keyboard layouts.
unbind-key b
unbind-key и
unbind-key m
unbind-key ь
unbind-key j
unbind-key о
set -g status-position bottom
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left-length 30
set -g status-left '#[fg=#cba6f7,bold] #S #[fg=#a6adc8,nobold]#{?#{||:#{==:#{pane_current_command},broot},#{@broot_file_import}}, ⌃C:выход,}#[default]'
set -g status-right-length 130
set -g status-right '#[fg=#cba6f7,bold]#{?client_prefix,#[fg=#1e1e2e]#[bg=#f9e2af],} ⌃B #[fg=#a6adc8,bg=#181825,nobold] v:↔ h:↕ · ⇧←↑↓→:местами · c:окно · z:зум · x:закрыть · d:выйти · ⌘⇧,:конфиг #[fg=#89b4fa,range=control|1]#(/usr/bin/python3 "$HOME/.config/ghostty-setup/codex-reset-countdown.py" #{?@codex_reset_exact,--exact,})#[range=right] #[fg=#cba6f7,bold]%H:%M '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'
set -g mode-style 'bg=#cba6f7,fg=#1e1e2e'
bind-key -n MouseDown1Control1 if-shell -F '#{@codex_reset_exact}' 'set-option -u @codex_reset_exact; refresh-client -S' 'set-option @codex_reset_exact 1; refresh-client -S'

bind-key -n SecondClick1Control1 if-shell -F '#{@codex_reset_exact}' 'set-option -u @codex_reset_exact; refresh-client -S' 'set-option @codex_reset_exact 1; refresh-client -S'

bind-key -n TripleClick1Control1 if-shell -F '#{@codex_reset_exact}' 'set-option -u @codex_reset_exact; refresh-client -S' 'set-option @codex_reset_exact 1; refresh-client -S'

# Keep mouse resizing native and immediate, including Option-drag.
bind-key -n M-MouseDown1Border select-pane -t =
bind-key -n M-MouseDrag1Border resize-pane -M
